<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a110c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Склад кафе">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Склад кафе</title>
<style>
:root{
  color-scheme:dark;
  --bg:#1a110c; --s1:#261a13; --s2:#30221a; --s3:#3c2b20;
  --line:rgba(245,230,205,.08); --line2:rgba(245,230,205,.16);
  --ink:#f6ead8; --ink2:#d9c8ae; --mut:#a89480; --dim:#75655a;
  --foam:#f0dfc2; --foam2:#e4cfa9; --on-foam:#2a1a0f;
  --ok:#a3cb9e; --okbg:rgba(163,203,158,.15);
  --warn:#e6bd62; --warnbg:rgba(230,189,98,.15);
  --bad:#e8918a; --badbg:rgba(232,145,138,.15);
  --f:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 50% at 50% -10%,#35231a 0%,rgba(53,35,26,0) 62%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .14s var(--ease),background-color .2s,opacity .2s,border-color .2s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--foam);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(116px + env(safe-area-inset-bottom))}
main.enter{animation:fadein .22s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}
.hd h1{margin:0;font-size:30px;line-height:1.1;font-weight:750;letter-spacing:-.02em}
.hd .sub{color:var(--mut);font-size:14px;margin-top:3px}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--ink2);display:grid;place-items:center}
.ibtn:disabled{opacity:.3}
h2{margin:26px 0 10px;font-size:17px;font-weight:700;letter-spacing:-.005em;color:var(--ink)}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.h2row h2{margin:0}
.hint{color:var(--mut);font-size:13.5px}
.mut{color:var(--mut)}
.sec-note{color:var(--mut);font-size:13.5px;margin:-4px 0 10px}

/* кнопки */
.btn{border:0;border-radius:16px;min-height:52px;padding:0 20px;font-weight:700;font-size:16px;background:var(--foam);color:var(--on-foam);width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{width:auto;min-height:42px;padding:0 16px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.55}
.linkbtn{background:none;border:0;color:var(--ink2);min-height:48px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;margin-top:10px}

/* чек: главный элемент экрана отчёта */
.ticket{--stub:116px;position:relative;display:grid;grid-template-columns:1fr var(--stub);background:var(--foam);color:var(--on-foam);border-radius:22px;margin:0 0 6px;
  -webkit-mask:radial-gradient(circle 10px at calc(100% - var(--stub)) 0,#0000 97%,#000),radial-gradient(circle 10px at calc(100% - var(--stub)) 100%,#0000 97%,#000);
  -webkit-mask-composite:source-in;
  mask:radial-gradient(circle 10px at calc(100% - var(--stub)) 0,#0000 97%,#000),radial-gradient(circle 10px at calc(100% - var(--stub)) 100%,#0000 97%,#000);
  mask-composite:intersect}
.ticket::after{content:"";position:absolute;top:14px;bottom:14px;right:var(--stub);border-left:2px dashed rgba(42,26,15,.28)}
.t-main{padding:16px 14px 16px 18px;min-width:0}
.t-main b{display:block;font-size:19px;line-height:1.2;font-weight:750;letter-spacing:-.01em}
.t-main span{display:block;margin-top:4px;font-size:13.5px;color:rgba(42,26,15,.7);line-height:1.35}
.t-stub{display:grid;place-items:center;padding:10px}
.t-stub button{width:100%;min-height:46px;border:0;border-radius:14px;background:var(--on-foam);color:var(--foam);font-weight:700;font-size:14.5px;line-height:1.15;padding:6px}
.t-stub button.soft{background:rgba(42,26,15,.1);color:var(--on-foam)}
.ticket.done .t-main b{display:flex;align-items:center;gap:8px}
.ticket.done .t-main .ic{color:#2f6b3a;width:22px;height:22px;stroke-width:2.4}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.daybar .d{flex:1;text-align:center;line-height:1.2}
.daybar .d b{display:block;font-size:16px}
.daybar .d span{color:var(--mut);font-size:13px}

/* плитки со счётчиком */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 17px;border-radius:99px;border:1px solid var(--line2);background:var(--s1);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:8px;max-width:100%}
.chip.add{border-style:dashed;background:transparent;color:var(--mut)}
.chip.sel{background:var(--foam);color:var(--on-foam);border-color:transparent}
.chip.on{background:var(--foam);color:var(--on-foam);border-color:transparent;padding:0;gap:0;overflow:hidden;cursor:default}
.chip.on:active{transform:none}
.chip.on .cb{width:46px;height:48px;border:0;background:none;color:inherit;display:grid;place-items:center;border-radius:0}
.chip.on .cb:active{background:rgba(42,26,15,.12);transform:none}
.chip.on .nm{border:0;background:none;color:inherit;font-weight:700;padding:0 2px;min-height:48px;display:inline-flex;align-items:center;gap:7px;min-width:0}
.cnt{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--on-foam);color:var(--foam);font-size:14px;font-weight:750}
.bump{animation:pop .3s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

/* список с делителями (обеды, закончилось) */
.list{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 16px;min-height:60px}
.li+.li{border-top:1px solid var(--line)}
.li .ln{font-weight:600;font-size:16.5px;min-width:0;overflow-wrap:anywhere}
.step{display:flex;align-items:center;gap:4px;flex:none}
.sb{width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--s2);color:var(--ink);display:grid;place-items:center}
.sn{min-width:56px;height:44px;border:0;background:none;display:grid;place-items:center;font-size:23px;font-weight:750;letter-spacing:-.02em;color:var(--ink)}
.sn.empty::before{content:"";display:block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin:0 auto}
.li.add{color:var(--mut)}
.li.add button{all:unset;display:flex;align-items:center;gap:8px;width:100%;min-height:44px;cursor:pointer;color:var(--mut);font-weight:600}
.need{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 16px;min-height:62px}
.need+.need{border-top:1px solid var(--line)}
.need .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 0}
.need .main b{display:block;font-size:16.5px;font-weight:650;overflow-wrap:anywhere}
.need .main span{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.pill{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--s3);color:var(--ink2);white-space:nowrap}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.done-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line2);background:none;color:var(--ink2);display:grid;place-items:center;flex:none}
.done-btn:active{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.empty-row{padding:18px 16px;color:var(--mut)}
.suggest{margin-top:12px}

/* склад, смены, люди, журнал */
.search{position:relative;margin:0 0 12px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{padding-left:44px;margin:0}
input,select,textarea{width:100%;padding:0 15px;min-height:52px;border-radius:14px;border:1px solid var(--line2);background:#150d09;color:var(--ink);margin:0 0 12px}
textarea{padding:13px 15px;line-height:1.4}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
input::placeholder,textarea::placeholder{color:var(--dim)}
label{display:block;font-size:13.5px;color:var(--mut);margin:0 0 6px 2px}
.big{font-size:32px;font-weight:750;min-height:68px;text-align:center;letter-spacing:-.02em}
.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line2);background:var(--s1);color:var(--ink2);border-radius:99px;min-height:42px;padding:0 16px;white-space:nowrap;font-weight:600;font-size:14.5px}
.fchip.on{background:var(--foam);color:var(--on-foam);border-color:transparent}
.prod{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:20px;padding:14px 16px;margin:0 0 10px;color:var(--ink)}
.prod .pn{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.prod .pm{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.prod .pq{text-align:right;flex:none}
.prod .pq b{font-size:30px;line-height:1;font-weight:750;letter-spacing:-.02em}
.prod .pq small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.bar{display:block;height:5px;border-radius:9px;background:var(--s3);margin-top:10px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:9px;background:var(--ok);transition:width .4s var(--ease)}
.bar.low u{background:var(--bad)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(98px + env(safe-area-inset-bottom));z-index:9;border:0;border-radius:99px;background:var(--foam);color:var(--on-foam);font-weight:750;padding:0 22px 0 18px;min-height:54px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.dayh{font-weight:700;margin:22px 0 10px;font-size:16px}
.dayh.today{color:var(--foam)}
.shiftc{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:18px;padding:14px 16px;margin:0 0 8px;color:var(--ink)}
.shiftc.me{border-color:rgba(240,223,194,.4)}
.shiftc b{font-size:17px}
.shiftc .t{font-weight:750;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.note{color:var(--mut);font-size:13px;margin-top:2px}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev i{width:9px;height:9px;border-radius:50%;background:var(--dim);margin-top:7px;flex:none}
.ev i.bad{background:var(--bad)}.ev i.ok{background:var(--ok)}.ev i.warn{background:var(--warn)}.ev i.acc{background:var(--foam)}
.ev .b{min-width:0;flex:1;line-height:1.35}
.ev .b b{font-weight:650}
.ev .tm{color:var(--mut);font-size:13px;white-space:nowrap;margin-top:2px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--s3);color:var(--foam);display:grid;place-items:center;font-weight:750;font-size:18px;flex:none}
.pers{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:18px;padding:12px 14px;margin:0 0 8px;color:var(--ink)}
.pers .pn{flex:1;min-width:0;font-weight:650;font-size:17px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 10px}
.card.warnbg{background:var(--warnbg);border-color:transparent}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--line);background:var(--s1);border-radius:18px;padding:14px 16px;margin:0 0 10px;color:var(--ink);font-weight:650;text-align:left}
.strip{display:flex;gap:6px;justify-content:space-between;margin-top:14px}
.sd{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;padding:2px 0}
.sd i{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.sd i .ic{width:17px;height:17px;stroke-width:2.6}
.sd.ok i{background:var(--okbg);border-color:transparent;color:var(--ok)}
.sd.part i{border-color:var(--warn);border-style:dashed}
.sd.cur span{color:var(--ink);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.kv+.kv{border-top:1px solid var(--line)}
.badge{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--s3);color:var(--ink2)}
.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.ok{background:var(--okbg);color:var(--ok)}
.err{background:var(--badbg);color:var(--bad);padding:12px 14px;border-radius:14px;margin:0 0 12px;font-size:14.5px}
.empty{text-align:center;color:var(--mut);padding:34px 12px}
.dayh .pair{display:block;color:var(--mut);font-weight:600;font-size:13.5px;margin-top:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.opts label{position:relative;margin:0;display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 10px;border-radius:14px;border:1px solid var(--line2);background:var(--s2);color:var(--ink2);font-weight:650;font-size:15px;text-align:center;cursor:pointer}
.opts input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;margin:0;padding:0}
.opts label:has(input:checked){background:var(--foam);color:var(--on-foam);border-color:transparent}
.opts label:has(input:focus-visible){outline:2px solid var(--foam);outline-offset:2px}

/* нижняя панель */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:28px;
  background:rgba(38,26,19,.86);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line2);box-shadow:0 12px 34px rgba(0,0,0,.55);z-index:10}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 6px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;position:relative;min-width:0}
.tabs button.on{color:var(--foam);background:rgba(240,223,194,.12)}
.tabs .dot{position:absolute;top:3px;left:calc(50% + 6px);background:var(--bad);color:#2a0d0a;border-radius:99px;font-size:11px;font-weight:800;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;font-style:normal}

/* шторки */
.sheet-bg{position:fixed;inset:0;background:rgba(10,5,3,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border-top:1px solid var(--line2);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet-bg:not(.still){animation:fadein .2s ease both}
.sheet-bg:not(.still) .sheet{animation:sheetin .36s var(--ease) both}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
.sheet-bg.closing{animation:fadeout .18s ease forwards}
.sheet-bg.closing .sheet{animation:sheetout .2s ease-in forwards}
@keyframes fadeout{to{opacity:0}}@keyframes sheetout{to{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:23px;font-weight:750;letter-spacing:-.015em}
.sheet .sub{color:var(--mut);font-size:14px}
.sheet h2{font-size:16px;margin:22px 0 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack>*+*{margin-top:8px}

/* уведомление */
#toast{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:40;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--s3);color:var(--ink);border:1px solid var(--line2);padding:12px 12px 12px 18px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:14px;max-width:100%;animation:toastin .28s var(--ease) both;font-weight:600;font-size:15px}
.toast button{border:0;background:rgba(240,223,194,.14);color:var(--foam);font-weight:700;border-radius:11px;min-height:38px;padding:0 14px;font-size:14.5px}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* вход */
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 24px;max-width:420px;margin:0 auto}
.logo{display:grid;place-items:center;margin-bottom:16px}
.logo .mark{width:84px;height:84px;border-radius:26px;background:var(--foam);color:var(--on-foam);display:grid;place-items:center}
.logo .ic{width:46px;height:46px;stroke-width:1.6}
.auth-t{text-align:center;margin:0;font-size:30px;font-weight:750;letter-spacing:-.02em}
.auth-s{text-align:center;color:var(--mut);margin:6px 0 26px}
.link{background:none;border:0;color:var(--ink2);font-weight:650;min-height:50px;width:100%;margin-top:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------- настройки и клиент ---------- */
const cfg = window.CAFE_CONFIG || {};
const cfgOk = !!(cfg.url && cfg.key && !/ВСТАВЬ/.test(cfg.url + cfg.key));
const sb = (cfgOk && window.supabase) ? window.supabase.createClient(cfg.url, cfg.key) : null;

const UNITS = ['шт','л','кг','г','уп','порц'];
const REASONS = ['Просрочка','Брак','Уронили','Для персонала','Другое'];
const ROLE_RU = {pending:'Ждёт подтверждения',worker:'Работник',admin:'Админ',owner:'Владелец',blocked:'Заблокирован'};
const KIND = {writeoff:'Списания', lunch:'Обеды'};
const ACT = {
  restock:'принял(а)', writeoff:'списал(а)', set:'пересчитал(а)',
  add_product:'добавил(а) продукт', edit_product:'изменил(а) продукт', delete_product:'удалил(а) продукт',
  role:'изменил(а) доступ', shift_add:'добавил(а) смену', shift_edit:'изменил(а) смену', shift_del:'удалил(а) смену',

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (+n).toLocaleString('ru-RU', {maximumFractionDigits:3});
const raw = n => fmt(n).replace(/\s/g,'').replace(',','.');
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const startOfToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dmy = s => { const [y,m,d] = s.split('-'); return d + '.' + m; };
const hm = t => String(t).slice(0,5);
const when = at => new Date(at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const timeOf = at => new Date(at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const dmDate = at => { const d = new Date(at); return pad(d.getDate()) + '.' + pad(d.getMonth()+1); };
const dayLabel = s => new Date(s + 'T00:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const cap = s => s.replace(/^./, c => c.toUpperCase());
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? null : n; };
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[(a > 10 && a < 20) ? 2 : b > 1 && b < 5 ? 1 : b === 1 ? 0 : 2]; };
const isAdmin = () => !!S.me && (S.me.role === 'admin' || S.me.role === 'owner');
const isStaff = () => !!S.me && ['worker','admin','owner'].includes(S.me.role);
const emailOf = login => login.trim().toLowerCase() + '@cafe-staff.app';
const loginOf = email => String(email || '').split('@')[0];
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} };

function dayShort(d){
  const t = startOfToday();
  if (d === iso(t)) return 'Сегодня';
  if (d === iso(addDays(t,-1))) return 'Вчера';
  return cap(dayLabel(d));
}
function greet(){
  const h = new Date().getHours();
  return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
}
function toast(msg, act){
  const t = $('#toast');
  t.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (act ? `<button data-a="toastAct">${esc(act.label)}</button>` : '') + '</div>';
  toast.act = act && act.fn;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.innerHTML = '', act ? 4500 : 3000);
}
function ru(msg){
  msg = String(msg || '');
  if (/Invalid login/i.test(msg)) return 'Неверный логин или пароль';
  if (/already registered|already been registered/i.test(msg)) return 'Такой логин уже занят';
  if (/not confirmed/i.test(msg)) return 'В Supabase включено подтверждение почты. Его нужно выключить (см. инструкцию)';
  if (/at least/i.test(msg)) return 'Пароль минимум 6 символов';
  if (/rate limit/i.test(msg)) return 'Слишком много попыток, подождите минуту';
  if (/fetch|network|Failed/i.test(msg)) return 'Нет связи, попробуйте ещё раз';
  return msg;
}

async function loadLogs(){ const {data,error} = await sb.from('audit_log').select('*').order('at',{ascending:false}).limit(400); if (error) throw error; S.logs = data || []; }

async function loadWeek(){
  const {data,error} = await sb.from('report_items').select('kind,name,qty,day,user_name').gte('day', iso(addDays(startOfToday(), -6))).limit(1500);
  if (error) throw error; S.week = data || [];
}
function topNames(rows, preset){
  const m = new Map();
  rows.forEach(r => { const k = String(r.name).trim().toLowerCase(); if (!k) return; const e = m.get(k) || {n:r.name.trim(), c:0}; e.c++; m.set(k, e); });
  const a = [...m.values()].sort((x,y) => y.c - x.c).map(e => e.n).slice(0, 14);
  preset.forEach(p => { if (a.length < 14 && !a.some(x => x.toLowerCase() === p.toLowerCase())) a.push(p); });
  return a;
}
async function loadNames(){
  const r1 = await sb.from('report_items').select('kind,name').gte('day', iso(addDays(startOfToday(), -45))).limit(2000); if (r1.error) throw r1.error;
  const r2 = await sb.from('need_items').select('name').order('created_at',{ascending:false}).limit(400); if (r2.error) throw r2.error;
  const rows = r1.data || [];
  S.names = {writeoff:topNames(rows.filter(x => x.kind==='writeoff'), PRESETS.writeoff), lunch:topNames(rows.filter(x => x.kind==='lunch'), PRESETS.lunch), need:topNames(r2.data || [], PRESETS.need)};
}
async function setDay(d){ S.reportDay = d; try{ await Promise.all([loadReport(), loadNotes()]); }catch(e){ toast(ru(e.message)); } render(); }
async function loadAll(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    S.session = session;
    if (!session){ S.me = null; return; }
    const {data:me,error} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if (error) throw error;
    S.me = me;
    if (!isStaff()) return;
    if (!S.tabInit){ S.tab = isAdmin() ? 'home' : 'report'; S.tabInit = true; }
    const jobs = [loadProducts(), loadLogs(), loadShifts(), loadReport(), loadNeeds(), loadNames(), loadDayReports(), loadNotes()];
    if (isAdmin()) jobs.push(loadPeople(), loadWeek(), loadOpenNotes());
    await Promise.all(jobs);
  }catch(e){ toast(ru(e.message)); }
  finally{ S.booting = false; render(); }
}
async function quickRefresh(){
  if (!S.me || S.sheet || pending || waiting) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  await loadAll();
}

  const y = window.scrollY, same = S.lastTab === S.tab;
  const bumpKey = S.bump; S.bump = null; render.bump = bumpKey;
  if (!cfgOk || !sb){
    app.innerHTML = `<div class="center"><div class="logo"><div class="mark">${ic('cup')}</div></div><h1 class="auth-t">Нужна настройка</h1>
      <p class="auth-s">${!cfgOk ? 'Откройте файл config.js и вставьте адрес и ключ проекта Supabase (инструкция в README).' : 'Не загрузилась библиотека. Проверьте интернет и обновите страницу.'}</p></div>`;
    return drawSheet();
  }
  if (S.booting){ app.innerHTML = `<div class="center"><div class="logo"><div class="mark">${ic('cup')}</div></div></div>`; return drawSheet(); }
  if (!S.session){ app.innerHTML = authHtml(); return drawSheet(); }
  if (!S.me){ app.innerHTML = waitHtml('Профиль не найден', 'Выйдите и зарегистрируйтесь заново. Если не помогает, проверьте, что в Supabase выполнен schema.sql.'); return drawSheet(); }
  if (S.me.role === 'pending'){ app.innerHTML = waitHtml('Ждём подтверждения', 'Вы зарегистрированы как ' + esc(S.me.name) + '. Админ должен вас принять, потом нажмите «Проверить».'); return drawSheet(); }
  if (S.me.role === 'blocked'){ app.innerHTML = waitHtml('Доступ закрыт', 'Обратитесь к администратору.', true); return drawSheet(); }

  const tabs = [['report','report','Отчёт'],['stock','box','Склад'],['shifts','cal','Смены'],['log','clock','Журнал'],['me','user','Кабинет']];
  if (isAdmin()) tabs.unshift(['home','home','Сводка']);
  const pend = isAdmin() ? S.people.filter(p => p.role === 'pending').length : 0;
  app.innerHTML = `<main class="${same ? '' : 'enter'}">` + screenHtml() + '</main><nav class="tabs">' +
    tabs.map(t => { const on = S.tab === t[0] || (S.tab === 'people' && t[0] === 'me');
      return `<button class="${on?'on':''}" data-a="tab" data-v="${t[0]}">${ic(t[1])}${t[2]}${t[0]==='me'&&pend?`<i class="dot">${pend}</i>`:''}</button>`; }).join('') + '</nav>' +
    (S.tab==='stock' && isAdmin() ? `<button class="fab" data-a="newProduct">${ic('plus')}Продукт</button>` : '') +
    (S.tab==='shifts' && isAdmin() ? `<button class="fab" data-a="newShift">${ic('plus')}Смена</button>` : '');
  window.scrollTo(0, same ? y : 0);
  S.lastTab = S.tab;
  drawSheet();
}

const nkey = n => String(n).trim().toLowerCase();
function findRow(k, n){ return S.report.find(r => r.kind === k && nkey(r.name) === nkey(n)); }
const qtyOf = (k, n) => { const r = findRow(k, n); return r ? r.qty : null; };
function kindNames(k){
  const seen = new Set(), out = [];
  S.names[k].concat(S.report.filter(r => r.kind === k).map(r => r.name)).forEach(n => { const key = nkey(n); if (key && !seen.has(key)){ seen.add(key); out.push(n.trim()); } });
  return out;
}
function chipHtml(k, n){

  const d = `data-k="${k}" data-n="${esc(n)}"`;
  if (!q) return `<button class="chip" data-a="inc" ${d}>${esc(n)}</button>`;
  return `<div class="chip on"><button class="cb" data-a="dec" ${d} aria-label="Минус">${ic('minus')}</button>

function reportHtml(){
  const today = iso(startOfToday());
  const dr = S.dayReports.find(x => x.day === S.reportDay);
  const n = S.report.length;
  const last = S.report.reduce((m, r) => { const t = r.updated_at || r.created_at; return t > m ? t : m; }, '');
  const ticket = dr
    ? `<div class="ticket done"><div class="t-main"><b>${ic('check')}Отчёт сдан</b><span>${esc(dr.submitted_by || '')}, ${timeOf(dr.submitted_at)}</span></div>
        <div class="t-stub"><button class="soft" data-a="reopen">Открыть снова</button></div></div>`
    : `<div class="ticket"><div class="t-main"><b>${n ? 'Отчёт ведётся' : 'Пока пусто'}</b>
        <span>${n ? n + ' ' + plural(n, ['запись','записи','записей']) + ', обновлён в ' + timeOf(last) : 'Нажимайте на позиции ниже в течение дня'}</span></div>
        <div class="t-stub"><button data-a="submit">Сдать отчёт</button></div></div>`;
  const needs = S.needs.map(x => `<div class="need"><button class="main" data-a="needItem" data-id="${x.id}"><b>${esc(x.name)}</b>
      <span>${esc(x.created_by || '')}, ${dmDate(x.created_at)}${x.note ? ', ' + esc(x.note) : ''}</span></button>
      <span class="pill ${x.status==='out'?'bad':'warn'}">${x.status==='out' ? 'закончилось' : 'заканчивается'}</span>
      <button class="done-btn" data-a="needDone" data-id="${x.id}" aria-label="Привезли">${ic('check')}</button></div>`).join('');

/* строки как в чате: "2 запеканки", "рис 2", "винегрет - 4", "капучино" */
function parseLines(text, withQty){
  return String(text || '').split(/\n+/).map(l => l.replace(/^[\s•*\-–]+/, '').trim()).filter(Boolean).map(l => {
    if (!withQty) return {name:l};
    let m;
    if ((m = l.match(/^(\d+(?:[.,]\d+)?)\s*(?:шт\.?|порц\.?)?\s*[-–:]?\s+(.+)$/i)) || (m = l.match(/^(\d+(?:[.,]\d+)?)()\s*([^\d\s].*)$/))){
      const nm = (m[3] || m[2]).trim();
      if (nm) return {name:nm, qty:parseFloat(m[1].replace(',','.'))};
    }
    if ((m = l.match(/^(.+?)\s*[-–:]?\s*(\d+(?:[.,]\d+)?)$/)) && m[1].trim()) return {name:m[1].trim().replace(/[-–:]$/,'').trim(), qty:parseFloat(m[2].replace(',','.'))};
    return {name:l};
  });
}
/* "запеканки" -> уже известное "запеканка", чтобы не плодить варианты */
function canonName(name, known){
  const a = name.trim().toLowerCase();
  for (const k of known){
    const b = k.toLowerCase();
    if (a === b) return k;
    let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
    if (i >= 4 && i >= Math.min(a.length, b.length) - 2 && !/\d/.test(a.slice(i)) && !/\d/.test(b.slice(i))) return k;
  }
  return name.trim();
}

/* --- быстрые правки: сразу на экране, на сервер уходят следом --- */
let pending = 0, waiting = 0, chain = Promise.resolve(), syncT = null;
const lunchT = {};
function send(fn){
  pending++;
  chain = chain.then(fn).catch(e => { toast(ru(e.message)); }).finally(() => { pending--; scheduleSync(); });
}
function scheduleSync(){
  clearTimeout(syncT);
  syncT = setTimeout(async () => {
    if (pending || waiting) return;
    try{ await Promise.all([loadReport(), loadNeeds(), loadDayReports(), loadNames()]); }catch(e){}
    render();
  }, 700);
}
function localSet(k, n, val, user){
  let r = findRow(k, n);
  if (!r){ r = {id:'tmp' + Date.now() + Math.random(), day:S.reportDay, kind:k, name:n.trim(), qty:0, user_name:S.me.name, created_at:new Date().toISOString()}; S.report.push(r); }
  r.qty = Math.max(0, val); r.user_name = S.me.name; r.updated_at = new Date().toISOString();
  if (k === 'writeoff' && r.qty <= 0) S.report = S.report.filter(x => x !== r);
}
function change(k, n, delta){
  const day = S.reportDay, cur = qtyOf(k, n) || 0;
  if (k === 'writeoff' && delta < 0 && !cur) return;
  buzz();
  if (k === 'writeoff'){
    localSet(k, n, cur + delta);
    S.bump = k + '|' + nkey(n); render();
    send(() => rpc('change_report_item', {p_day:day, p_kind:k, p_name:n, p_delta:delta, p_set:false}));
    if (delta > 0 && cur === 0) toast('Списано: ' + n, {label:'Отменить', fn:() => change(k, n, -1)});
  }else{
    const nv = Math.max(0, cur + delta);
    if (cur === 0 && delta < 0 && qtyOf(k, n) != null) return;
    localSet(k, n, nv);
    S.bump = k + '|' + nkey(n); render();
    waiting++; clearTimeout(lunchT[nkey(n)]);
    lunchT[nkey(n)] = setTimeout(() => { waiting--; send(() => rpc('change_report_item', {p_day:day, p_kind:k, p_name:n, p_delta:nv, p_set:true})); }, 550);
  }
}
function setExact(k, n, v){
  const day = S.reportDay;
  localSet(k, n, v); S.bump = k + '|' + nkey(n); render();
  send(() => rpc('change_report_item', {p_day:day, p_kind:k, p_name:n, p_delta:v, p_set:true}));
}

/* items: [{sup, line}] -> текст, разбитый по поставщикам */
function groupedOrder(items, empty){
  if (!items.length) return empty;
  const g = new Map();
  items.forEach(x => { if (!g.has(x.sup)) g.set(x.sup, []); g.get(x.sup).push(x.line); });
  const keys = [...g.keys()].sort((a,b) => (a === NO_SUPPLIER) - (b === NO_SUPPLIER) || a.localeCompare(b, 'ru'));
  return 'Нужно заказать:\n\n' + keys.map(k => k + ':\n' + g.get(k).map(l => '• ' + l).join('\n')).join('\n\n');
}

  const list = S.shifts.filter(s => S.showPast || s.day >= today);
  const days = {}; list.forEach(s => (days[s.day] = days[s.day] || []).push(s));
  const keys = Object.keys(days).sort();
  const tag = isAdmin() ? 'button' : 'div';
  return header('График смен', isAdmin() ? 'Нажмите на смену, чтобы изменить' : 'Общий график, ваши смены выделены') +
    (keys.length ? keys.map(k => { const names = [...new Set(days[k].map(shiftName).filter(Boolean))];
      return `<div class="dayh ${k === today ? 'today' : ''}">${k === today ? 'Сегодня, ' + dayLabel(k) : cap(dayLabel(k))}${names.length > 1 ? `<span class="pair">${names.map(esc).join(' + ')}</span>` : ''}</div>` +
      days[k].map(s => `<${tag} class="shiftc ${s.user_id === S.me.id ? 'me' : ''}" ${isAdmin() ? `data-a="editShift" data-id="${s.id}"` : ''}>
        <div><b>${esc(shiftName(s))}</b>${s.user_id === S.me.id ? ' <span class="badge">вы</span>' : ''}${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}</div>
        <div class="t">${hm(s.start_time)} - ${hm(s.end_time)}</div></${tag}>`).join(''); }).join('')
      : '<div class="empty">Смен пока нет</div>') +
    `<button class="fchip" style="margin-top:14px" data-a="past">${S.showPast ? 'Скрыть прошедшие' : 'Показать прошедшие за 7 дней'}</button>`;
}

const initial = n => String(n || '?').trim().charAt(0).toUpperCase();
function personCard(p){
  const b = {pending:'warn',worker:'',admin:'ok',owner:'ok',blocked:'bad'}[p.role];
  return `<button class="pers" data-a="person" data-id="${p.id}"><div class="avatar">${esc(initial(p.name))}</div><div class="pn">${esc(p.name)}<div class="note">с ${new Date(p.created_at).toLocaleDateString('ru-RU')}</div></div><span class="badge ${b}">${ROLE_RU[p.role]}</span></button>`;
}
function peopleHtml(){
  const pend = S.people.filter(p => p.role === 'pending'), rest = S.people.filter(p => p.role !== 'pending');

function meHtml(){

  const mine = S.shifts.filter(s => s.user_id === S.me.id && s.day >= today).slice(0,5);

      <div><b style="font-size:19px">${esc(S.me.name)}</b><div class="note" style="margin-top:4px">${ROLE_RU[S.me.role]}, логин ${esc(loginOf(S.session.user.email))}</div></div></div>
    ${isAdmin() ? `<button class="menu" data-a="tab" data-v="people"><span style="display:flex;align-items:center;gap:10px">${ic('people')}Люди и доступ</span>${pend ? `<span class="badge warn">ждут: ${pend}</span>` : ic('right')}</button>` : ''}

/* ================= ШТОРКИ ================= */
function drawSheet(){
  const el = $('#sheet'), s = S.sheet, had = !!el.firstChild;
  document.documentElement.style.overflow = s ? 'hidden' : '';
  if (!s){ el.innerHTML = ''; return; }
  if (!had) $('#toast').innerHTML = '';
  const map = {note:noteFormSheet, nnote:noteSheet, product:productSheet, shift:shiftSheet, person:personSheet, order:orderSheet, text:textSheet, ritem:itemSheet, num:numSheet, need:needSheet, nitem:needItemSheet, pass:passSheet};
  const body = (map[s.t] || (() => ''))(s);
  el.innerHTML = `<div class="sheet-bg ${had ? 'still' : ''}" data-a="closeBg"><div class="sheet"><div class="grab"></div>${body}</div></div>`;
  if (!had){ const f = el.querySelector('[data-focus]'); if (f) setTimeout(() => { f.focus(); try{ f.select(); }catch(e){} }, 340); }
}
const closeBtn = '<button class="btn ghost" data-a="close" style="margin-top:12px">Закрыть</button>';

function productSheet(s){
  const p = S.products.find(x => x.id === s.id);
  if (s.mode === 'edit') return productForm(p);
  if (!p) return closeBtn;
  const modes = {restock:['Приход','Сколько пришло'], writeoff:['Списание','Сколько списать'], set:['Пересчёт','Сколько реально осталось']};
  let form = '';
  if (s.mode){
    form = `<form data-f="stock"><input type="hidden" name="mode" value="${s.mode}">
      <label>${modes[s.mode][1]}, ${esc(p.unit)}</label>
      <input name="amount" class="big" inputmode="decimal" autocomplete="off" required placeholder="0" data-focus value="${s.mode==='set' ? raw(p.qty) : ''}">
      ${s.mode === 'writeoff' ? `<label>Причина</label><select name="reason">${REASONS.map(r => `<option>${r}</option>`).join('')}</select>
        <label>Комментарий, если нужно</label><input name="note" autocomplete="off">` : ''}
      ${s.mode === 'restock' ? `<label>Откуда</label><div class="opts">${Object.entries(SOURCES).map(([k,v], i) => `<label><input type="radio" name="source" value="${k}" ${i ? '' : 'checked'}>${v}</label>`).join('')}</div>
        <label>Годен до, если нужно</label><input name="exp" type="date">
        <label>Комментарий, если нужно</label><input name="note" autocomplete="off">` : ''}
      <button class="btn" type="submit">Сохранить</button></form>`;
  }
  return `<h3>${esc(p.name)}</h3><div class="sub">Сейчас ${fmt(p.qty)} ${esc(p.unit)}${p.expires_on ? ', годен до ' + dmy(p.expires_on) : ''}${p.supplier ? ', поставщик ' + esc(p.supplier) : ''}</div>
    <div class="seg">${Object.entries(modes).map(([k,v]) => `<button class="btn ${s.mode===k?'':'alt'}" data-a="mode" data-v="${k}" style="padding:0 8px;font-size:15px">${v[0]}</button>`).join('')}</div>
    ${form}${isAdmin() ? '<button class="btn alt" data-a="editProduct" style="margin-top:10px">Изменить продукт</button>' : ''}${closeBtn}`;
}

function needItemSheet(s){
  const n = S.needs.find(x => x.id === s.id); if (!n) return closeBtn;

function shiftSheet(s){
  const sh = s.id ? S.shifts.find(x => x.id === s.id) : null;
  const staff = S.people.filter(p => ['worker','admin','owner'].includes(p.role));
  return `<h3>${sh ? 'Изменить смену' : 'Новая смена'}</h3><form data-f="shift" style="margin-top:14px">
    <input type="hidden" name="id" value="${sh ? sh.id : ''}">
    <label>Кто</label><select name="user" required>${staff.map(p => `<option value="${p.id}" ${sh && sh.user_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <label>Дата</label><input name="day" type="date" required value="${sh ? sh.day : iso(startOfToday())}">
    <div class="grid2"><div><label>С</label><input name="start" type="time" required value="${sh ? hm(sh.start_time) : '09:00'}"></div>
    <div><label>До</label><input name="end" type="time" required value="${sh ? hm(sh.end_time) : '18:00'}"></div></div>
    <label>Заметка, если нужно</label><input name="note" value="${sh ? esc(sh.note || '') : ''}">
    <button class="btn" type="submit">Сохранить</button></form>
    ${sh ? '<button class="btn danger" data-a="delShift" style="margin-top:10px">Удалить смену</button>' : ''}${closeBtn}`;
}
function personSheet(s){
  const p = S.people.find(x => x.id === s.id); if (!p) return closeBtn;
  const owner = S.me.role === 'owner', self = p.id === S.me.id, locked = !owner && (p.role === 'admin' || p.role === 'owner');
  let opts = [];
  if (!self && !locked){
    opts = owner ? [['worker','Работник'],['admin','Админ'],['owner','Владелец'],['blocked','Заблокировать']] : [['worker','Работник'],['blocked','Заблокировать']];
    if (p.role === 'pending') opts = opts.map(o => o[0] === 'blocked' ? ['blocked','Отклонить'] : o);
  }
  return `<h3>${esc(p.name)}</h3><div class="sub">Сейчас: ${ROLE_RU[p.role].toLowerCase()}</div>
    <div class="stack" style="margin-top:16px">${opts.length ? opts.filter(o => o[0] !== p.role).map(o => `<button class="btn ${o[0]==='blocked'?'danger':(o[0]==='worker'&&p.role==='pending'?'':'alt')}" data-a="role" data-id="${p.id}" data-v="${o[0]}">${p.role==='pending'&&o[0]==='worker'?'Принять как работника':o[1]}</button>`).join('') : `<div class="mut">${self ? 'Свою роль менять нельзя.' : 'Менять админов и владельцев может только владелец.'}</div>`}</div>${closeBtn}`;
}
function passSheet(){
  return `<h3>Сменить пароль</h3><form data-f="pass" style="margin-top:14px">
    <label>Новый пароль, минимум 6 символов</label><input name="p1" type="password" required minlength="6" autocomplete="new-password" data-focus>
    <button class="btn" type="submit">Сохранить</button></form>${closeBtn}`;
}

/* ================= ДЕЙСТВИЯ ================= */
function closeSheet(){
  const bg = document.querySelector('#sheet .sheet-bg'); if (!bg){ S.sheet = null; return drawSheet(); }
  bg.classList.add('closing'); setTimeout(() => { S.sheet = null; drawSheet(); }, 190);
}
const A = {
  tab(el){ S.tab = el.dataset.v; render(); quickRefresh(); },
  refresh(){ S.booting = false; loadAll().then(() => toast('Обновлено')); },
  sf(el){ S.stockFilter = el.dataset.v; render(); },
  lt(el){ S.logType = el.dataset.v; render(); },
  past(){ S.showPast = !S.showPast; render(); },
  authMode(){ S.authMode = S.authMode === 'in' ? 'up' : 'in'; S.authErr = ''; render(); },
  toastAct(){ const f = toast.act; $('#toast').innerHTML = ''; if (f) f(); },
  dayPrev(){ setDay(iso(addDays(new Date(S.reportDay + 'T00:00:00'), -1))); },
  dayNext(){ const t = iso(startOfToday()), n = iso(addDays(new Date(S.reportDay + 'T00:00:00'), 1)); if (n <= t) setDay(n); },
  goDay(el){ S.tab = 'report'; S.reportDay = el.dataset.d; S.lastTab = null; Promise.all([loadReport(), loadNotes()]).then(render, render); },
  inc(el){ change(el.dataset.k, el.dataset.n, 1); },
  dec(el){ change(el.dataset.k, el.dataset.n, -1); },
  num(el){ S.sheet = {t:'num', k:el.dataset.k, n:el.dataset.n}; drawSheet(); },
  numDel(){
    const r = findRow(S.sheet.k, S.sheet.n); closeSheet();
    if (!r) return;
    S.report = S.report.filter(x => x !== r); render();
    if (!String(r.id).startsWith('tmp')) send(() => rpc('delete_report_item', {p_id:r.id}));
  },
  addItem(el){ S.sheet = {t:'ritem', k:el.dataset.k}; drawSheet(); },
  addNeed(){ S.sheet = {t:'need'}; drawSheet(); },
  needItem(el){ S.sheet = {t:'nitem', id:el.dataset.id}; drawSheet(); },
  needQuick(el){
    const n = el.dataset.n; buzz();
    S.needs.push({id:'tmp' + Date.now(), name:n, status:'out', created_by:S.me.name, created_at:new Date().toISOString()}); render();
    send(() => rpc('add_needs', {p_items:[{name:n, status:'out'}]}));
    toast('Отмечено: ' + n);
  },
  needDone(el){
    const id = el.dataset.id; if (String(id).startsWith('tmp')) return toast('Секунду, сохраняется');
    buzz(); S.needs = S.needs.filter(x => x.id !== id); if (S.sheet) { S.sheet = null; drawSheet(); } render();
    send(() => rpc('resolve_need', {p_id:id})); toast('Отмечено: привезли');
  },
  needSet(el){ const id = el.dataset.id, v = el.dataset.v; const n = S.needs.find(x => x.id === id); if (n) n.status = v; closeSheet(); render(); send(() => rpc('set_need', {p_id:id, p_status:v})); },
  needDel(el){ const id = el.dataset.id; if (!confirm('Убрать из списка?')) return; S.needs = S.needs.filter(x => x.id !== id); closeSheet(); render(); send(() => rpc('delete_need', {p_id:id})); },
  async submit(){
    try{ await rpc('submit_report', {p_day:S.reportDay}); await loadDayReports(); render(); buzz(); toast('Отчёт сдан'); }catch(e){ toast(ru(e.message)); }
  },
  async reopen(){
    try{ await rpc('reopen_report', {p_day:S.reportDay}); await loadDayReports(); render(); toast('Отчёт открыт, можно вносить'); }catch(e){ toast(ru(e.message)); }
  },
  addNote(el){ S.sheet = {t:'note', k:el.dataset.v}; drawSheet(); },
  noteItem(el){ S.sheet = {t:'nnote', id:el.dataset.id}; drawSheet(); },
  noteFill(el){ const t = document.querySelector('#sheet textarea[name=text]'); if (t){ t.value = el.dataset.v; t.focus(); } },
  async noteDone(el){
    buzz();
    try{ await rpc('resolve_shift_note', {p_id:el.dataset.id}); if (S.sheet){ S.sheet = null; drawSheet(); } await reloadNotes(); render(); toast('Заметка закрыта'); }catch(e){ toast(ru(e.message)); }
  },
  async noteDel(el){
    if (!confirm('Удалить заметку? Это попадёт в журнал.')) return;
    try{ await rpc('delete_shift_note', {p_id:el.dataset.id}); S.sheet = null; await reloadNotes(); render(); toast('Удалено'); }catch(e){ toast(ru(e.message)); }
  },
  reportText(){ S.sheet = {t:'text', title:'Текст отчёта', sub:'Можно скопировать и отправить в чат', text:reportText()}; drawSheet(); },
  orderAll(){ S.sheet = {t:'text', title:'Список заказа', sub:'Что отметили работники и что ниже минимума на складе', text:orderAllText()}; drawSheet(); },
  order(){ S.sheet = {t:'order'}; drawSheet(); },
  open(el){ S.sheet = {t:'product', id:el.dataset.id, mode:null}; drawSheet(); },
  mode(el){ S.sheet.mode = el.dataset.v; drawSheet(); },
  newProduct(){ S.sheet = {t:'product', id:null, mode:'edit'}; drawSheet(); },
  editProduct(){ S.sheet.mode = 'edit'; drawSheet(); },
  newShift(){ S.sheet = {t:'shift', id:null}; drawSheet(); },
  editShift(el){ S.sheet = {t:'shift', id:el.dataset.id}; drawSheet(); },
  person(el){ S.sheet = {t:'person', id:el.dataset.id}; drawSheet(); },
  pass(){ S.sheet = {t:'pass'}; drawSheet(); },
  close(){ closeSheet(); },
  closeBg(el, e){ if (e.target === el) closeSheet(); },
  async logout(){ await sb.auth.signOut(); S.session = null; S.me = null; S.sheet = null; S.tab = 'report'; S.tabInit = false; S.lastTab = null; render(); },
  async delProduct(){
    const p = S.products.find(x => x.id === S.sheet.id);
    if (!p || !confirm('Удалить «' + p.name + '»? Это попадёт в журнал.')) return;
    try{ await rpc('delete_product', {p_id:p.id}); S.sheet = null; await loadAll(); toast('Удалено'); }catch(e){ toast(ru(e.message)); }
  },
  async delShift(){
    if (!confirm('Удалить смену?')) return;
    try{ const {error} = await sb.from('shifts').delete().eq('id', S.sheet.id); if (error) throw error; S.sheet = null; await loadAll(); toast('Смена удалена'); }catch(e){ toast(ru(e.message)); }
  },
  async role(el){
    try{ await rpc('set_role', {p_user:el.dataset.id, p_role:el.dataset.v}); S.sheet = null; await loadAll(); toast('Готово'); }catch(e){ toast(ru(e.message)); }
  },
  copy(){
    const t = $('#ordertext'); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.resolve(document.execCommand('copy')))
      .then(() => toast('Скопировано')).catch(() => toast('Выделите текст и скопируйте вручную'));
  },
  share(){ navigator.share({text: $('#ordertext').value}).catch(() => {}); },
  csv(){
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['Время','Кто','Действие','Продукт','Было','Стало','Комментарий']].concat(
      logsFiltered().map(l => [when(l.at), l.user_name, (ACT[l.action] || l.action), l.product_name, l.old_qty, l.new_qty, l.note]));
    const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zhurnal-' + iso(new Date()) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (f) f(el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  S[k] = e.target.value;
  if (k === 'q') drawStockList(); else render();
});

const F = {
  async auth(f){
    const fd = new FormData(f), login = String(fd.get('login')).trim().toLowerCase(), pass = String(fd.get('pass'));
    S.authErr = '';
    try{
      if (S.authMode === 'up'){
        const name = String(fd.get('name')).trim();
        const {data,error} = await sb.auth.signUp({email:emailOf(login), password:pass, options:{data:{name}}});
        if (error) throw error;
        if (!data.session){ const r = await sb.auth.signInWithPassword({email:emailOf(login), password:pass}); if (r.error) throw r.error; }
      }else{
        const {error} = await sb.auth.signInWithPassword({email:emailOf(login), password:pass}); if (error) throw error;
      }
      S.booting = true; render(); await loadAll();
    }catch(e){ S.authErr = ru(e.message); S.booting = false; render(); }
  },
  num(f){
    const fd = new FormData(f), v = num(fd.get('v')); if (v == null || v < 0) return toast('Введите число');
    const k = fd.get('k'), n = fd.get('n'); closeSheet();
    if (k === 'writeoff' && v === 0){ const r = findRow(k, n); if (r){ S.report = S.report.filter(x => x !== r); render(); if (!String(r.id).startsWith('tmp')) send(() => rpc('delete_report_item', {p_id:r.id})); } return; }
    setExact(k, n, v);
  },
  async ritem(f){
    const fd = new FormData(f), k = fd.get('k'), name = canonName(String(fd.get('name')), S.names[k]); if (!name) return;
    try{
      await rpc('add_report_items', {p_day:S.reportDay, p_kind:k, p_items:[{name, qty:num(fd.get('qty')), note:String(fd.get('note') || '').trim()}]});
      S.sheet = null; await loadAll(); toast('Добавлено: ' + name);
    }catch(e){ toast(ru(e.message)); }
  },
  async rlist(f){
    const fd = new FormData(f), k = fd.get('k'), items = parseLines(fd.get('text'), true).map(x => ({name:canonName(x.name, S.names[k]), qty: x.qty != null ? x.qty : (k === 'writeoff' ? 1 : null)}));
    if (!items.length) return toast('Вставьте хотя бы одну строку');
    try{ await rpc('add_report_items', {p_day:S.reportDay, p_kind:k, p_items:items}); S.sheet = null; await loadAll(); toast('Добавлено строк: ' + items.length); }catch(e){ toast(ru(e.message)); }
  },
  async need(f){
    const fd = new FormData(f), name = canonName(String(fd.get('name')), S.names.need); if (!name) return;
    try{ await rpc('add_needs', {p_items:[{name, status:fd.get('status'), note:String(fd.get('note') || '').trim()}]}); S.sheet = null; await loadAll(); toast('Добавлено в список'); }catch(e){ toast(ru(e.message)); }
  },
  async nlist(f){
    const fd = new FormData(f), st = fd.get('status'), items = parseLines(fd.get('text'), false).map(x => ({name:canonName(x.name, S.names.need), status:st}));
    if (!items.length) return toast('Вставьте хотя бы одну строку');
    try{ await rpc('add_needs', {p_items:items}); S.sheet = null; await loadAll(); toast('Добавлено строк: ' + items.length); }catch(e){ toast(ru(e.message)); }
  },
  async stock(f){
    const fd = new FormData(f), mode = fd.get('mode'), amount = num(fd.get('amount'));
    if (amount == null) return toast('Введите число');
    let reason = null;
    if (mode === 'writeoff'){ reason = fd.get('reason'); const n = String(fd.get('note') || '').trim(); if (n) reason += ': ' + n; }
    if (mode === 'restock') reason = String(fd.get('note') || '').trim() || null;
    try{
      await rpc('change_stock', {p_product:S.sheet.id, p_kind:mode, p_amount:amount, p_reason:reason, p_expires:(mode==='restock' && fd.get('exp')) || null,
        p_source:mode === 'restock' ? (fd.get('source') || 'supplier') : null});
      S.sheet = null; await loadAll(); toast('Сохранено');
    }catch(e){ toast(ru(e.message)); }
  },
  async product(f){
    const fd = new FormData(f);
    try{
      await rpc('save_product', {p_id:fd.get('id') || null, p_name:String(fd.get('name')).trim(), p_unit:fd.get('unit'),
        p_min:num(fd.get('min')) || 0, p_qty:num(fd.get('qty')) || 0, p_expires:fd.get('exp') || null, p_supplier:String(fd.get('supplier') || '').trim() || null});
      S.sheet = null; await loadAll(); toast('Сохранено');
    }catch(e){ toast(ru(e.message)); }
  },
  async note(f){
    const fd = new FormData(f), k = fd.get('k'), text = String(fd.get('text') || '').trim();
    if (!text) return toast('Напишите, что случилось');
    let amount = null;
    if (k === 'purchase'){
      amount = num(fd.get('amount'));
      if (amount == null){ const m = text.match(/(\d+(?:[.,]\d+)?)\s*(?:₽|руб[а-яё]*|р(?![а-яё]))/i); if (m) amount = num(m[1]); }
      if (!amount || amount <= 0) return toast('Укажите сумму по чеку');
    }
    try{
      await rpc('add_shift_note', {p_day:S.reportDay, p_kind:k, p_text:text, p_amount:amount, p_paid:k === 'purchase' ? (fd.get('paid') || 'cash') : null});
      S.sheet = null; await reloadNotes(); render(); buzz(); toast(k === 'purchase' ? 'Покупка записана' : 'Заметка записана');
    }catch(e){ toast(ru(e.message)); }
  },
  async shift(f){
    const fd = new FormData(f), id = fd.get('id');
    if (fd.get('end') <= fd.get('start')) return toast('Конец смены должен быть позже начала');
    const row = {user_id:fd.get('user'), day:fd.get('day'), start_time:fd.get('start'), end_time:fd.get('end'), note:String(fd.get('note') || '').trim() || null};
    try{
      const r = id ? await sb.from('shifts').update(row).eq('id', id) : await sb.from('shifts').insert(row);
      if (r.error) throw r.error;
      S.sheet = null; await loadAll(); toast('Сохранено');
    }catch(e){ toast(ru(e.message)); }
  },
  async pass(f){
    const p = new FormData(f).get('p1');
    try{ const {error} = await sb.auth.updateUser({password:p}); if (error) throw error; closeSheet(); toast('Пароль изменён'); }catch(e){ toast(ru(e.message)); }
  }
};
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.f) return;
  e.preventDefault();
  const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try{ await F[f.dataset.f](f); } finally{ if (btn && btn.isConnected) btn.disabled = false; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.session) quickRefresh(); });
setInterval(() => { if (!document.hidden && S.session) quickRefresh(); }, 45000);

/* ---------- старт ---------- */
if (cfgOk && sb) loadAll(); else { S.booting = false; render(); }
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
